---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tsmetrics-network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tsmetrics
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the monitoring namespace may scrape. kubernetes.io/metadata.name is
    # set by Kubernetes on every namespace, no custom label needed.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9100
  egress:
    # Tailscale API (HTTPS) + HTTP redirects from upstream captive portals.
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    # Tailscale device metrics endpoints (port 5252) inside the tailnet.
    # Safe to restrict further with `to.ipBlock.cidr: 100.64.0.0/10` if you
    # only scrape devices that live in the standard Tailscale CGNAT range.
    - to: []
      ports:
        - protocol: TCP
          port: 5252
    # Kubernetes API server for the tsnet `kube:` state store. NetworkPolicy
    # sees the endpoint port after Service translation: 443 on many managed
    # clusters (covered above), 6443 on kubeadm, k3s and others.
    - to: []
      ports:
        - protocol: TCP
          port: 6443
    # DNS resolution (UDP primary, TCP fallback for large responses).
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
