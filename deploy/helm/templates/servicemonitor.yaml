---
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "tsmetrics.fullname" . }}
  labels:
    {{- include "tsmetrics.labels" . | nindent 4 }}
  {{- with .Values.serviceMonitor.labels }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.serviceMonitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "tsmetrics.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      {{- $chartSecret := and (not .Values.externalSecret.enabled) .Values.tailscale.metricsToken }}
      {{- $extSecret := and .Values.externalSecret.enabled .Values.serviceMonitor.bearerTokenAuth }}
      {{- if or $chartSecret $extSecret }}
      authorization:
        type: Bearer
        credentials:
          name: {{ if $extSecret }}{{ .Values.externalSecret.secretName }}{{ else }}{{ include "tsmetrics.fullname" . }}-secrets{{ end }}
          key: METRICS_TOKEN
      {{- end }}
{{- end }}
